  <main>
    <h1 class="page-title">Contact</h1>
    <p class="page-intro">//For commissions, performances, scores, and everything else.</p>
    <div class="contact">
      <div>
        <h2>Write to me</h2>
        <!-- To reduce spam, you can write the address as you [at] example [dot] com instead of a link. -->
        <p><a class="email-link" href="mailto:elischalet@gmail.com">elischalet@gmail.com</a></p>
        <ul class="social">
          <li><a href="https://instagram.com/eschalet" target="_blank" rel="noopener">Instagram</a></li>
          <li><a href="https://youtube.com/@elischalet" target="_blank" rel="noopener">YouTube</a></li>
          <li><a href="https://soundcloud.com/eli-schalet" target="_blank" rel="noopener">SoundCloud</a></li>
          <li><a href="https://elischalet.bandcamp.com" target="_blank" rel="noopener">Bandcamp</a></li>
        </ul>
      </div>
      <div>
        <h2>Send a message</h2>
        <!-- Sign up free at formspree.io, create a form, and replace YOUR_ID below. -->
        <form action="https://formspree.io/f/mjywwpbk" method="POST">
          <label for="name">Name</label>
          <input id="name" type="text" name="name" required>
          <label for="email">Email</label>
          <input id="email" type="email" name="email" required>
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
          <button type="submit">Send message</button>
        </form>
      </div>
    </div>
  </main>
